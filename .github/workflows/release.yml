name: ServIQ 수동 이미지 릴리스

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serviq-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: 승인 후 GHCR 이미지 게시
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: GitHub Container Registry 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Python 이미지 태그와 라벨
        id: python-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-python
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - name: 프론트엔드 이미지 태그와 라벨
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - name: Python 이미지 빌드와 게시
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.python-meta.outputs.tags }}
          labels: ${{ steps.python-meta.outputs.labels }}
          cache-from: type=gha,scope=serviq-python
          cache-to: type=gha,mode=max,scope=serviq-python
      - name: 프론트엔드 이미지 빌드와 게시
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            VITE_API_MODE=http
            VITE_API_BASE_URL=/api/v1
          cache-from: type=gha,scope=serviq-frontend
          cache-to: type=gha,mode=max,scope=serviq-frontend
