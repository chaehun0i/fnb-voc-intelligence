[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fnb-voc-intelligence"
version = "0.1.0"
description = "Food and beverage VOC intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pydantic",
    "pydantic-settings",
    "python-dotenv>=1,<2",
    "pgvector",
    "psycopg[binary]",
    "streamlit",
    "fastapi[standard]",
    "uvicorn",
    "jsonschema>=4.23,<5",
    "google-genai>=1.0,<2",
    "httpx>=0.28,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1,<1",
]

[project.scripts]
vector-search = "src.rag.vector_cli:main"
rag-query = "src.rag.rag_cli:main"
voc-dashboard = "src.dashboard.app:main"
scale-index = "src.rag.scale_cli:main"
ingest-data = "src.ingestion.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["backend"]

[tool.setuptools.packages.find]
where = ["backend", "."]
include = ["src*", "db*"]

[tool.setuptools.package-dir]
src = "backend/src"
db = "db"

[tool.setuptools.package-data]
"db.migrations" = ["*.sql"]
"src.analysis" = ["taxonomy_v1.json"]
