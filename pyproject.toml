[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fnb-voc-intelligence"
version = "0.1.0"
description = "Food and beverage VOC intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pydantic",
    "pydantic-settings",
    "pgvector",
    "psycopg[binary]",
    "streamlit",
]

[project.scripts]
vector-search = "src.rag.vector_cli:main"
rag-query = "src.rag.rag_cli:main"
voc-dashboard = "src.dashboard.app:main"
scale-index = "src.rag.scale_cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
